<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRATOS — Grafo Estratégico</title>
  <script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.4/dist/force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.8.2/dist/three-spritetext.min.js"></script>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
      --accent: #ffb703; --border: #283039;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: var(--panel); border-bottom: 1px solid var(--border); position: relative; z-index: 5;
      flex-wrap: wrap; justify-content: center; row-gap: 8px;
    }
    header h1 { font-size: 1rem; margin: 0; }
    header .meta { color: var(--muted); font-size: 0.78rem; }
    header .spacer { flex: 1; }
    /* chip de contagem (nós/conexões) dentro do header */
    #status {
      color: var(--muted); font-size: 0.76rem; background: #1c232c;
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; white-space: nowrap;
    }
    .nav {
      color: var(--text); text-decoration: none; font-size: 0.82rem;
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; background: #1c232c;
      cursor: pointer; white-space: nowrap;
    }
    .nav:hover { border-color: var(--accent); color: var(--accent); }
    #wrap { position: absolute; inset: 56px 0 0 0; }
    #graph { width: 100%; height: 100%; }
    @media (max-width: 720px) {
      header { padding: 8px 10px; gap: 8px; }
      header h1 { width: 100%; text-align: center; font-size: .95rem; }
      header .meta { display: none; }   /* redundante com a Legenda */
      header .spacer { display: none; }
      #wrap { inset: 92px 0 0 0; }
    }
    #legend {
      position: absolute; left: 12px; bottom: 12px; z-index: 5;
      background: rgba(22,27,34,0.92); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 0.78rem; max-width: 220px;
    }
    #legend h2 { font-size: 0.78rem; margin: 0 0 6px; color: var(--accent); }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    #legend .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
    #status {
      position: absolute; right: 12px; top: 60px; z-index: 5; color: var(--muted);
      font-size: 0.78rem; background: rgba(22,27,34,0.92); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px;
    }
    #err { color: #ff7b72; }
  </style>
</head>
<body>
  <header>
    <h1>KRATOS — Grafo Estratégico</h1>
    <span class="meta">Manobra ↔ Navio ↔ Berço ↔ Rebocador ↔ Empresa ↔ Dia</span>
    <span class="spacer"></span>
    <span id="status">Carregando grafo…</span>
    <button type="button" class="nav" id="btnDim" title="Alternar 2D / 3D">🧊 3D</button>
    <button type="button" class="nav" id="btnReload">↻ Atualizar</button>
    <a class="nav" id="backDash" href="#">← Painel</a>
    <a class="nav" id="backMap" href="#">Mapa</a>
  </header>

  <div id="wrap"><div id="graph"></div></div>

  <div id="legend">
    <h2>Legenda</h2>
    <div class="row"><span class="dot" style="background:#2ecc71"></span> Rebocador SAAM</div>
    <div class="row"><span class="dot" style="background:#ff4d4d"></span> Rebocador concorrente</div>
    <div class="row"><span class="dot" style="background:#4aa3ff"></span> Navio</div>
    <div class="row"><span class="dot" style="background:#ffd23f"></span> Berço</div>
    <div class="row"><span class="dot" style="background:#a970ff"></span> Manobra</div>
    <div class="row"><span class="dot" style="background:#ff9f1c"></span> Empresa</div>
    <div class="row"><span class="dot" style="background:#9aa5b1"></span> Dia</div>
  </div>

  <script>
    const COLORS = {
      "manobra": "#a970ff",
      "navio": "#4aa3ff",
      "berco": "#ffd23f",
      "rebocador-saam": "#2ecc71",
      "rebocador-concorrente": "#ff4d4d",
      "empresa-saam": "#ffb703",
      "empresa-concorrente": "#ff9f1c",
      "dia": "#9aa5b1",
    };

    function basePath() {
      let p = (window.location.pathname || "/").replace(/\/+$/, "");
      if (p.endsWith("/graph")) p = p.slice(0, -"/graph".length);
      return p.replace(/\/+$/, "") || "";
    }
    function apiUrl(path) {
      const pp = path.startsWith("/") ? path : "/" + path;
      const joined = basePath() + pp;
      try { return new URL(joined, window.location.origin).href; } catch (_) { return joined; }
    }
    document.getElementById("backDash").href = basePath() + "/dashboard";
    document.getElementById("backMap").href = basePath() + "/";

    const elem = document.getElementById("graph");
    let mode = "2d";                       // "2d" | "3d"
    let Graph = null;                      // instância atual
    let currentData = { nodes: [], links: [] };
    let fitted = false;

    // Config compartilhada entre 2D e 3D.
    function applyCommon(g) {
      return g
        .backgroundColor("#0e1116")
        .nodeId("id")
        .nodeLabel(n => n.label)
        .nodeColor(n => COLORS[n.group] || "#8b949e")
        .nodeVal(n => n.val || 1)
        .nodeRelSize(4)
        .linkColor(() => "rgba(150,160,170,0.22)")
        .linkWidth(0.6);
    }

    function refit() {
      const pad = mode === "3d" ? 80 : 60;
      try { Graph.zoomToFit(600, pad); } catch (_) {}
    }

    function buildGraph() {
      elem.innerHTML = "";
      fitted = false;
      if (mode === "3d") {
        Graph = applyCommon(ForceGraph3D()(elem))
          .linkOpacity(0.35)
          .onNodeClick(node => {
            // "Voa" a câmera até o nó clicado.
            const d = 120;
            const h = Math.hypot(node.x || 1, node.y || 1, node.z || 1) || 1;
            const r = 1 + d / h;
            Graph.cameraPosition(
              { x: (node.x || 0) * r, y: (node.y || 0) * r, z: (node.z || 0) * r },
              node, 900
            );
          });
        if (typeof SpriteText !== "undefined") {
          Graph.nodeThreeObjectExtend(true).nodeThreeObject(n => {
            const s = new SpriteText(n.label || "");
            s.color = COLORS[n.group] || "#cfd8e3";
            s.textHeight = Math.max(3, Math.sqrt(n.val || 1) * 2.2);
            s.material.depthWrite = false;
            return s;
          });
        }
      } else {
        Graph = applyCommon(ForceGraph()(elem))
          .onNodeClick(node => { Graph.centerAt(node.x, node.y, 600); Graph.zoom(4, 600); })
          .nodeCanvasObjectMode(() => "after")
          .nodeCanvasObject((node, ctx, scale) => {
            // Rótulo aparece com zoom suficiente (estilo Obsidian).
            if (scale < 1.6) return;
            const label = node.label || "";
            const fontSize = 11 / scale;
            ctx.font = `${fontSize}px -apple-system, Segoe UI, Roboto, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillStyle = "rgba(230,237,243,0.9)";
            const r = Math.sqrt(node.val || 1) * 4 / scale;
            ctx.fillText(label, node.x, node.y + r + 1);
          });
      }
      // Enquadra quando a simulação estabiliza.
      Graph.cooldownTicks(mode === "3d" ? 100 : 120).onEngineStop(() => {
        if (!fitted) { refit(); fitted = true; }
      });
      fit();
      Graph.graphData(currentData);
      setTimeout(refit, 1600);
    }

    function fit() { if (Graph) Graph.width(elem.clientWidth).height(elem.clientHeight); }
    window.addEventListener("resize", fit);

    function updateStatus() {
      const status = document.getElementById("status");
      status.textContent = `${currentData.nodes.length} nós · ${currentData.links.length} conexões · ${mode.toUpperCase()}`;
    }

    function setMode(next) {
      mode = next;
      const btn = document.getElementById("btnDim");
      if (btn) btn.textContent = mode === "3d" ? "🔲 2D" : "🧊 3D";
      buildGraph();
      updateStatus();
    }

    async function load() {
      const status = document.getElementById("status");
      status.classList.remove("err"); status.textContent = "Carregando grafo…";
      try {
        const res = await fetch(apiUrl("/api/obsidian/graph"), { cache: "no-store" });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        currentData = { nodes: data.nodes || [], links: data.links || [] };
        buildGraph();
        updateStatus();
      } catch (e) {
        status.classList.add("err");
        status.textContent = "Falha ao carregar o grafo: " + (e.message || e);
      }
    }

    document.getElementById("btnReload").addEventListener("click", load);
    document.getElementById("btnDim").addEventListener("click", () => setMode(mode === "3d" ? "2d" : "3d"));
    load();
  </script>
</body>
</html>

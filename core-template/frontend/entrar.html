<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Acesso — KRATOS Core</title>
<style>
  :root { --bg:#0a0e17; --panel:#111826; --line:#1e2a3d; --txt:#e6edf6; --muted:#8aa0bd; --accent:#3da9fc; --ok:#2ecc71; --err:#ff5c6c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
         background:radial-gradient(1200px 600px at 50% -10%, #13233b 0%, var(--bg) 60%); color:var(--txt); padding:20px; }
  .card { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px 24px;
          box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .brand { font-size:22px; font-weight:800; letter-spacing:.5px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0c1220; color:var(--txt); font-size:15px; }
  button { width:100%; margin-top:16px; padding:12px 14px; border:0; border-radius:10px; background:var(--accent); color:#04121f;
           font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; font-size:14px; min-height:20px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .hint { margin-top:18px; font-size:12px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
  <main class="card">
    <h1 class="brand">KRATOS Core</h1>
    <p class="sub">Acesso restrito — informe seu convite</p>
    <form id="form" autocomplete="off">
      <label for="token">Código de convite</label>
      <input id="token" name="token" type="text" inputmode="text" placeholder="cole seu convite aqui" required />
      <button id="btn" type="submit">Entrar</button>
    </form>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <p class="hint">Não tem convite? Solicite ao administrador. Seu acesso fica salvo neste dispositivo.</p>
  </main>
<script>
(function () {
  "use strict";
  // Base path resolve (suporta subcaminho via root_path/SCRIPT_NAME).
  var BASE = location.pathname.replace(/\/entrar\/?$/, "") || "";
  var api = function (p) { return BASE + p; };
  var form = document.getElementById("form");
  var input = document.getElementById("token");
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");

  // Pré-preenche se vier ?access=... na URL.
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get("access")) input.value = qs.get("access").trim();
  } catch (e) {}

  function show(text, kind) { msg.textContent = text; msg.className = "msg " + (kind || ""); }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var token = input.value.trim();
    if (!token) return;
    btn.disabled = true; show("Validando…", "");
    fetch(api("/api/access/validate"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      credentials: "include", body: JSON.stringify({ token: token })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.valid) {
        show("Acesso liberado. Redirecionando…", "ok");
        setTimeout(function () { location.href = (BASE || "") + "/"; }, 600);
      } else {
        show("Convite inválido, expirado ou revogado.", "err");
        btn.disabled = false;
      }
    })
    .catch(function () { show("Falha de conexão. Tente novamente.", "err"); btn.disabled = false; });
  });
})();
</script>
</body>
</html>
